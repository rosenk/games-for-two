<!doctype html>
<html lang="bg">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101827" />
    <meta
      name="description"
      content="Морски шах за двама играчи на един екран."
    />
    <title>Морски шах</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&amp;display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="game-shell">
      <header class="game-header">
        <div>
          <p class="eyebrow">Игра за двама</p>
          <h1>Морски шах<span aria-hidden="true">.</span></h1>
        </div>
        <button class="icon-button" id="reset-score" type="button">
          <span aria-hidden="true">↻</span>
          Нулирай резултата
        </button>
      </header>

      <section class="scoreboard" aria-label="Резултат">
        <article class="player-card player-x active" data-player-card="X">
          <span class="player-symbol" aria-hidden="true">×</span>
          <div>
            <span class="player-label">Играч 1</span>
            <strong id="score-x">0</strong>
          </div>
        </article>

        <div class="draw-score">
          <span>Равни</span>
          <strong id="score-draw">0</strong>
        </div>

        <article class="player-card player-o" data-player-card="O">
          <span class="player-symbol" aria-hidden="true">○</span>
          <div>
            <span class="player-label">Играч 2</span>
            <strong id="score-o">0</strong>
          </div>
        </article>
      </section>

      <section class="play-area" aria-labelledby="game-status">
        <div class="turn-indicator">
          <span class="turn-dot" aria-hidden="true"></span>
          <p id="game-status" aria-live="polite">
            Играч 1 е на ход <strong>×</strong>
          </p>
        </div>

        <div class="board" id="board" role="grid" aria-label="Дъска за морски шах">
          <button class="cell" type="button" data-cell="0" role="gridcell" aria-label="Горе вляво"></button>
          <button class="cell" type="button" data-cell="1" role="gridcell" aria-label="Горе в средата"></button>
          <button class="cell" type="button" data-cell="2" role="gridcell" aria-label="Горе вдясно"></button>
          <button class="cell" type="button" data-cell="3" role="gridcell" aria-label="В средата вляво"></button>
          <button class="cell" type="button" data-cell="4" role="gridcell" aria-label="В центъра"></button>
          <button class="cell" type="button" data-cell="5" role="gridcell" aria-label="В средата вдясно"></button>
          <button class="cell" type="button" data-cell="6" role="gridcell" aria-label="Долу вляво"></button>
          <button class="cell" type="button" data-cell="7" role="gridcell" aria-label="Долу в средата"></button>
          <button class="cell" type="button" data-cell="8" role="gridcell" aria-label="Долу вдясно"></button>
        </div>

        <button class="new-round" id="new-round" type="button">
          <span>Нов рунд</span>
          <span aria-hidden="true">→</span>
        </button>
      </section>
    </main>

    <div class="background-shape shape-one" aria-hidden="true"></div>
    <div class="background-shape shape-two" aria-hidden="true"></div>

    <script src="app.js"></script>
  </body>
</html>
